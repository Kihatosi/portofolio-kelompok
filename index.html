<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Eksperimen Data Kelompok</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1, h2 { color: #1a73e8; }
    .controls { margin-bottom: 20px; padding: 15px; background: #eef2f7; border-radius: 5px; }
    canvas { max-width: 100%; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboard Eksperimen Empiris</h1>
    <p>Portofolio Analisis Data Terukur & Interaktif Kelompok</p>
    
    <div class="controls">
      <label for="metric"><b>Pilih Parameter Eksperimen:</b> </label>
      <select id="metric" onchange="renderChart()">
        <option value="execution_time_ms">Waktu Eksekusi (ms)</option>
        <option value="accuracy">Akurasi (%)</option>
      </select>
    </div>

    <canvas id="experimentChart"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
